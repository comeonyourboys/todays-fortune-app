<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px;
    height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
  }
  .icon {
    width: 512px;
    height: 512px;
    border-radius: 100px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
  }
  .glow1 { background: #8b5cf6; top: -50px; left: -50px; }
  .glow2 { background: #3b82f6; bottom: -50px; right: -50px; }
  .emoji {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .title {
    font-family: -apple-system, sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: white;
    letter-spacing: -1px;
    position: relative;
    z-index: 1;
  }
  .sub {
    font-family: -apple-system, sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    position: relative;
    z-index: 1;
    letter-spacing: 4px;
  }
  .stars {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.8) 1px, transparent 0),
      radial-gradient(1px 1px at 35% 45%, rgba(255,255,255,0.5) 1px, transparent 0),
      radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.7) 1px, transparent 0),
      radial-gradient(1px 1px at 75% 65%, rgba(255,255,255,0.6) 1px, transparent 0),
      radial-gradient(1px 1px at 85% 30%, rgba(255,255,255,0.8) 1px, transparent 0),
      radial-gradient(1px 1px at 25% 80%, rgba(255,255,255,0.4) 1px, transparent 0),
      radial-gradient(1px 1px at 65% 85%, rgba(255,255,255,0.6) 1px, transparent 0);
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="stars"></div>
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="emoji">🔮</div>
    <div class="title">오늘의 운세</div>
    <div class="sub">DAILY FORTUNE</div>
  </div>
</body>
</html>
