function sr(s){let x=Math.sin(s)*10000;return x-Math.floor(x);}
function pk(a,s){return a[Math.floor(sr(s)*a.length)];}
function sc(s){return Math.floor(sr(s)*18+80);}
function getCustom(signKey, field, seed) {
  const day = String(today.getDate());
  const dayPad = day.padStart(2,'0');
  // 두 가지 키 포맷 모두 시도
  if (CUSTOM_FORTUNE && CUSTOM_FORTUNE[signKey]) {
    const data = CUSTOM_FORTUNE[signKey][day] || CUSTOM_FORTUNE[signKey][dayPad];
    if (data && data[field]) return data[field];
  }
  return '운세 데이터를 확인 중...';
}
function getOL(score,seed){
  if(score>=95)return pk(OL_90,seed);
  if(score>=88)return pk(OL_80,seed);
  return pk(OL_70,seed);
}

// 변화 뱃지 HTML
function changeBadge(todayScore, yesterdayScore) {
  const diff = todayScore - yesterdayScore;
  if(diff > 0) return `<span class="change-badge up">▲${diff}</span>`;
  if(diff < 0) return `<span class="change-badge down">▼${Math.abs(diff)}</span>`;
  return `<span class="change-badge same">—</span>`;
}

// 랭킹 생성
function getRanking(selectedIndex) {
  const y=today.getFullYear(), m=today.getMonth()+1, d=today.getDate();
  return Z.map((z,i)=>{
    const b=y*100000+m*1000+d*13+i*7;
    return {index:i, name:z.n, emoji:z.e, score:sc(b)};
  }).sort((a,b)=>b.score-a.score).map((item,rank)=>({...item, rank:rank+1, isMe:item.index===selectedIndex}));
}

// 오늘 하면 좋은 일 / 피할 일
function getTips(seed) {
  const doList=[], dontList=[];
  const doUsed=new Set(), dontUsed=new Set();
  for(let i=0;i<3;i++){
    let idx;
    do { idx=Math.floor(sr(seed+100+i*7)*DO_ITEMS.length); } while(doUsed.has(idx));
    doUsed.add(idx); doList.push(DO_ITEMS[idx]);
    do { idx=Math.floor(sr(seed+200+i*7)*DONT_ITEMS.length); } while(dontUsed.has(idx));
    dontUsed.add(idx); dontList.push(DONT_ITEMS[idx]);
  }
  return {doList, dontList};
}
