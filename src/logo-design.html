<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:1024px;overflow:hidden;font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(145deg,#2a2a52 0%,#14142b 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.g{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:640px;height:640px;top:-240px;right:-180px;background:rgba(124,92,255,.5)}
.g2{width:520px;height:520px;bottom:-260px;left:-160px;background:rgba(255,196,120,.28)}
.star{position:absolute;border-radius:50%;background:#fff}
.sym{font-size:440px;line-height:1;filter:drop-shadow(0 30px 60px rgba(0,0,0,.4));position:relative;top:-24px}
.t{font-size:112px;font-weight:900;letter-spacing:-3px;margin-top:-6px;text-shadow:0 6px 24px rgba(0,0,0,.3)}
.s{font-size:38px;font-weight:700;letter-spacing:12px;color:rgba(255,255,255,.55);margin-top:14px}
</style></head><body>
<div class="g g1"></div><div class="g g2"></div>
<div class="star" style="width:6px;height:6px;top:130px;left:170px;opacity:.6"></div>
<div class="star" style="width:4px;height:4px;top:210px;left:840px;opacity:.5"></div>
<div class="star" style="width:5px;height:5px;top:780px;left:110px;opacity:.4"></div>
<div class="star" style="width:4px;height:4px;top:900px;left:770px;opacity:.5"></div>
<div class="star" style="width:3px;height:3px;top:340px;left:80px;opacity:.5"></div>
<div class="star" style="width:3px;height:3px;top:650px;left:940px;opacity:.5"></div>
<div class="sym">✨</div>
<div class="t">오늘의 운세</div>
<div class="s">TODAY'S FORTUNE</div>
</body></html>
